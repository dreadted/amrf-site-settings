name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
          - manual
      version:
        description: "New Version (only used when bump_type is 'manual', e.g., 0.2.1)"
        required: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine New Version
        id: version
        run: |
          BUMP_TYPE="${{ inputs.bump_type }}"

          if [ "$BUMP_TYPE" = "manual" ]; then
            NEW_VERSION="${{ inputs.version }}"
            if [ -z "$NEW_VERSION" ]; then
              echo "::error::bump_type is 'manual' but no version was provided."
              exit 1
            fi
          else
            CURRENT_VERSION=$(grep -oP 'Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' amrf-admin.php)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "$BUMP_TYPE" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
                ;;
            esac
            echo "Current version: $CURRENT_VERSION -> New version: $NEW_VERSION"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog Content
        id: changelog
        run: |
          # Find the last tag. If none, use the first commit.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Collecting commits since: $LAST_TAG"

          # Get commit messages, format as list items, excluding merge commits
          CHANGES=$(git log $LAST_TAG..HEAD --pretty=format:"- %s" --no-merges)

          if [ -z "$CHANGES" ]; then
            CHANGES="- Maintenance release."
          fi

          # Use a delimiter for multi-line output to environment variable
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CHANGES<<$EOF" >> $GITHUB_ENV
          echo "$CHANGES" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Update Version Files
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # Update amrf-admin.php (Matches "Version: X.X.X" and preserves spacing)
          sed -i "s/Version:[[:space:]]*[0-9.]*/Version:         $NEW_VERSION/" amrf-admin.php

          # Update readme.txt
          sed -i "s/Stable tag:[[:space:]]*[0-9.]*/Stable tag: $NEW_VERSION/" readme.txt

          # Update changelog.txt
          # Create a temporary file with the new entry block
          echo "" > new_entry.txt
          echo "$NEW_VERSION" >> new_entry.txt
          echo "------" >> new_entry.txt
          echo "$CHANGES" >> new_entry.txt

          # Insert new entry after line 5 (after the header block)
          sed -i '5r new_entry.txt' changelog.txt
          rm new_entry.txt

      - name: Commit and Push
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git add amrf-admin.php readme.txt changelog.txt
          git commit -m "Bump version to $NEW_VERSION"
          git push
